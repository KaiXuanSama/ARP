# AgentreProxy - Docker Compose 编排
#
# 用法:
#   1. 第一次部署: docker compose up -d --build
#   2. 模型列表:   内存快照(上游 /v3/config),在管理面板「更新模型列表」按钮刷新,无静态文件
#   3. 备份数据:    整个 ./Config/ 目录就是你的所有持久化状态(仅 SQLite 数据库)
#
# 查看编译过程(默认 Docker 会用进度条覆盖输出,加 --progress=plain 即可):
#   docker compose build --progress=plain
#   docker compose up -d --build --progress=plain
# 看到 Maven 输出 / npm install / vite build 等所有阶段日志
#
# 端口: 主机 8351 -> 容器 8351
# 编译期想看过程: docker compose build --progress=plain
# tty: true 让 build 阶段的实时进度行不被 Docker 截断/覆盖

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      # 想强制不走缓存,改 --no-cache;想看完整编译输出,在外面加 --progress=plain
      #
      # 构建期所有下载源已默认指向国内镜像(pom.xml + .mvn/docker-settings.xml),
      # 国内服务器无需额外配置。需要换回官方源时,在这里用 args 覆盖:
      #   MAVEN_MIRROR_URL: https://repo.maven.apache.org/maven2   # Maven 依赖/插件
      #   MVNW_REPOURL: https://repo.maven.apache.org/maven2       # Maven 发行包
      #   NODE_DOWNLOAD_ROOT: https://nodejs.org/dist/             # Node 二进制
      #   NPM_REGISTRY_URL: https://registry.npmjs.org/            # npm 依赖
      #
      # 注:前两个是 ENV 语义(被子进程读取),后两个是命令行 -D 展开。
      args:
        # 基础镜像仓库前缀(结尾需带斜杠)。留空 = Docker Hub 官方。
        # 私有仓库/镜像加速场景在 .env 里配 IMAGE_REGISTRY 即可，勿改本文件
        IMAGE_REGISTRY: ${IMAGE_REGISTRY:-}
        # 以下四项留空即用镜像内默认值(国内镜像)；需要官方源时在 .env 里配
        MAVEN_MIRROR_URL: ${MAVEN_MIRROR_URL:-}
        MVNW_REPOURL: ${MVNW_REPOURL:-}
        NODE_DOWNLOAD_ROOT: ${NODE_DOWNLOAD_ROOT:-}
        NPM_REGISTRY_URL: ${NPM_REGISTRY_URL:-}
    image: agentreproxy:latest
    container_name: agentreproxy
    restart: unless-stopped
    tty: true
    stdin_open: false
    ports:
      # 宿主机端口可配(默认 8351)。改端口请在 .env 里配 HOST_PORT，勿改本文件。
      # 容器内始终是 8351，改 .env 后无需动 Dockerfile 的 ENTRYPOINT。
      - "${HOST_PORT:-8351}:8351"
    volumes:
      # 单一挂载点:数据库落到 ./Config/
      # 容器内 /data 软链:
      #   - /data/agentreproxy.db     -> ./Config/agentreproxy.db
      - ./Config:/data
    environment:
      TZ: Asia/Shanghai
      # 备用覆盖:如需改库名,改这里后也要同步改 Dockerfile 的 ENTRYPOINT
      SQLITE_URL: jdbc:sqlite:/data/agentreproxy.db
    healthcheck:
      # 容器内无 curl,用 wget 探测根路径(/api/* 都需要鉴权,根路径会返回 200/404 都视为存活)
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8351/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
