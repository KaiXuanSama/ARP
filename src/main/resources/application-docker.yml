spring:
  application:
    name: agentreproxy
  # SQLite 数据源（位于项目根目录）
  datasource:
    url: ${SQLITE_URL:jdbc:sqlite:${user.dir}/agentreproxy.db}
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 10
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

  # WebFlux 内存缓冲阈值:与 application.yml 保持一致(25MB)。
  # 路径在 Spring 3.5 改为 spring.http.codecs.*(旧 spring.codec.* 已弃用)。
  http:
    codecs:
      max-in-memory-size: 25MB

# Docker 环境配置
server:
  port: 8351

# 模型目录:内存快照,来源上游 /v3/config(见 ModelCatalogService)
#   - Docker 与本地行为一致:启动自动拉一次 + 管理面板手动刷新,无静态文件、无回退
