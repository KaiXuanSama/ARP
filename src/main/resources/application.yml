spring:
  application:
    name: agentreproxy
  datasource:
    url: ${SQLITE_URL:jdbc:sqlite:./agentreproxy.db}
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 10
  sql:
    init:
      mode: always
  # WebFlux 内存缓冲阈值:超过此大小会落盘到临时目录。
  # 设为 25MB 是为了承接 /v1/chat/completions 的长上下文(目前 ~257KB,
  # 未来 1M token 场景约 4MB+),避免被默认 512KB 拦下报 413。
  # Spring 启动时会自动把这个值透传到 Netty HttpRequestDecoderSpec.maxContentLength。
  # Spring 3.5 路径:spring.http.codecs.max-in-memory-size(旧 spring.codec.* 已废弃)
  http:
    codecs:
      max-in-memory-size: 25MB

# Docker 环境配置
server:
  port: 8351

# 模型列表外部配置(支持 yml / 命令行 / 环境变量覆盖)
#   - 文件不存在时回退到 classpath 内置 models-config.default.json
#   - 命令行覆盖: --models.config.path=D:\conf\modelsConfig.json
#   - 环境变量覆盖(Spring 自动映射): set MODELS_CONFIG_PATH=D:\conf\modelsConfig.json
models:
  config:
    path: ./modelsConfig.json

# 排查开关:打印 /v1/chat/completions 与 /v1/messages 的每个 SSE chunk 原文
#   - 默认 false;一次对话动辄上百个 chunk,开启后日志量很大,仅排查时临时打开
#   - 注意:不能挂在 spring 内置的 debug 顶层属性下(它是 boolean,会绑定冲突),
#     因此自定义前缀用 custom.*
#   - 临时开启(无需改本文件):
#       .\mvnw.cmd spring-boot:run "-Dspring-boot.run.arguments=--custom.chunk-log.enabled=true"
#       java -jar app.jar --custom.chunk-log.enabled=true
#   - 输出两类行:
#       [chunk原文]  完整 element(未经任何处理)
#       [chunk摘要]  delta 里所有非空字段 —— 一眼看出思维链落在哪个字段
custom:
  chunk-log:
    enabled: false

  # Anthropic 端点(/v1/messages)的上游路径选择
  #   true  = 桥接模式(默认):请求转 OpenAI → 调 /v2/chat/completions → 响应翻译回 Anthropic
  #           上游 OpenAI 端点返回 usage.credit,因此积分统计与 credit_limit 正常工作
  #   false = 直连模式:直接调上游 /v1/messages,零转换
  #           协议原生无转换风险,但上游不返回 credit,无法计费
  #
  # 背景:Claude Code 硬编码走 Anthropic 协议,而上游 Anthropic 端点实测不返回 credit,
  #      导致该场景完全无法统计消耗。桥接模式是为解决这个问题引入的。
  anthropic:
    bridge-via-openai: true

  # 扫码登录(插件授权流,获取上游凭证)
  #   背景:旧书签回传方案随官方封堵 /console/login/enterprise 而失效(2026-10 移除)。
  #        新链路:服务端伪装官方 CLI 调上游 /v2/plugin/auth/* 三个接口 ——
  #        创建会话拿官方登录链接 → 用户扫码 → 服务端轮询领取凭证并落库。
  #        token 永不出服务端,无需书签 / 回传 / CORS / 对外地址配置。
  #
  #   cli-version: 伪装官方 CLI 控制面请求的 UA 版本号。
  #                UA 形态:CLI/{cli-version} CodeBuddy/{cli-version},上游会校验 UA 形态。
  #                版本取自官方 CLI(npm @tencent-ai/codebuddy-code)2026-09-28 的 latest(2.159.0);
  #                上游若收紧校验(返回 400/12403 "check ua"),跟进官方新版号改这里即可。
  login:
    cli-version: 2.159.0